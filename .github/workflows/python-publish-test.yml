# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package Test

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags')) || (github.event_name == 'workflow_dispatch')
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
        pip install -e .
    - name: Cache landmarks 0
      uses: actions/cache@v4
      id: cache-data-0
      with:
        path: |
          vectome/data/landmarks/group-0
          vectome/data/sketches/group-0
        key: data-${{ hashFiles('vectome/data/strain-list-0.txt') }}
    - name: Build landmarks 0
      if: steps.cache-data-0.outputs.cache-hit != 'true'
      run: |
        vectome build 0
    - name: Build package
      run: python -m build --sdist --wheel --outdir dist
    - name: Upload data artifact (CI artifact)
      uses: actions/upload-artifact@v4
      with:
        name: built-data-test
        path: vectome/data
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        user: __token__
        password: ${{ secrets.TEST_PIPI_TOKEN }}
        verbose: true
