name: build-landmarks-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate landmarks 4
        run: |
          vectome build 4 --force --cache _landmarks

      - name: Generate landmarks 50
        run: |
          vectome build 50 --force --cache _landmarks

      - name: Generate landmarks 100
        run: |
          vectome build 100 --force --cache _landmarks

      - name: Package landmarks
        run: |
          tar -C _landmarks -czf vectome-landmarks.tar.gz .

      - name: Create checksums.json
        run: |
          python - <<'PY'
          import hashlib, json, os
          fn = "vectome-landmarks.tar.gz"
          h = hashlib.sha256()
          with open(fn, "rb") as f:
            for chunk in iter(lambda: f.read(1024*1024), b""):
              h.update(chunk)
          data = {fn: {"sha256": h.hexdigest(), "bytes": os.path.getsize(fn)}}
          with open("checksums.json", "w") as f:
            json.dump(data, f, indent=2)
          print(json.dumps(data, indent=2))
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vectome-landmarks
          path: |
            vectome-landmarks.tar.gz
            checksums.json
          retention-days: 7
